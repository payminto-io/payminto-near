[package]
name = "payminto-hub"
description = "Payminto clearing hub for NEP-141 agent payments"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build parameters, per NEP-330.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-sandbox = "0.4.0"
near-api = "0.8"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }

[workspace]
members = ["mock_ft"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
