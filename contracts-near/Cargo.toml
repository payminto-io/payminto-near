[package]
name = "payminto-hub"
description = "Payminto clearing hub for NEP-141 agent payments"
version = "0.2.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 Docker build, for verifying a pushed commit (for example on SourceScan): cargo-near 0.23.0 and Rust 1.99.1,
# the versions `build.sh` uses. Its wasm embeds the image and commit in the contract metadata, so its hash differs
# from `out/hub.wasm`, which `build.sh` builds.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

# `default-features = false` drops near-sdk's only default feature, `wee_alloc` (unmaintained, RUSTSEC-2022-0054):
# Rust's own allocator for wasm32 takes over.
[dependencies]
near-sdk = { version = "5.30.1", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30.1", default-features = false, features = ["unit-testing"] }
near-sandbox = "0.4.0"
near-api = "0.8"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
sha2 = "0.10.9"

[workspace]
members = ["mock_ft"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
