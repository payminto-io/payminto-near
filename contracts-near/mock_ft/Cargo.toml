[package]
name = "mock-ft"
description = "Mock NEP-141 token for Payminto hub sandbox tests only"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", default-features = false }
near-contract-standards = "5.30.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
