# Payminto Clearing: self-hosted node + dashboard.
#
#   NEAR testnet:  cp .env.docker.example .env, fill in, then: docker compose up -d --build
#
# Variables come from the shell or from .env next to this file (docs/DEPLOY.md, docs/OPERATIONS.md).

name: payminto

services:
  node:
    build:
      context: .
      dockerfile: apps/node/Dockerfile
    image: payminto/node:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NETWORK: ${NETWORK:-near:testnet}
      RPC_URL: ${RPC_URL:-https://rpc.testnet.near.org}
      HUB_ACCOUNT: ${HUB_ACCOUNT:?set HUB_ACCOUNT}
      OPERATOR_ACCOUNT: ${OPERATOR_ACCOUNT:?set OPERATOR_ACCOUNT}
      OPERATOR_KEY: ${OPERATOR_KEY:?set OPERATOR_KEY}
      NODE_SIGNING_SEED: ${NODE_SIGNING_SEED:?set NODE_SIGNING_SEED}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      HOST: 0.0.0.0
      PORT: "8787"
      DB_PATH: /data/clearing.db
      BACKUP_DIR: /data/backups
      # The dashboard proxies agents' /l/* and /pay/* requests to the node (GATEWAY.md section 5), so at least one
      # X-Forwarded-For hop is in front of the node: trust it, or every proxied agent shares the dashboard's IP for
      # rate limits and x402 drafts (docs/OPERATIONS.md, "Trusted proxy hops").
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - node-data:/data
    ports:
      # Loopback only by default: put a TLS reverse proxy in front for remote access (docs/OPERATIONS.md).
      - "${NODE_PUBLISH:-127.0.0.1:8787}:8787"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # The node URL as the operator's browser reaches it (baked into the bundle at build time).
        NEXT_PUBLIC_NODE_URL: ${NEXT_PUBLIC_NODE_URL:-http://localhost:8787}
    image: payminto/dashboard:local
    restart: unless-stopped
    environment:
      # Where the dashboard's proxy.ts reaches the node from inside the compose network (read at runtime).
      NODE_INTERNAL_URL: ${NODE_INTERNAL_URL:-http://node:8787}
    ports:
      - "${DASHBOARD_PUBLISH:-127.0.0.1:3000}:3000"
    depends_on:
      node:
        condition: service_healthy

volumes:
  node-data:
