name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests, dashboard build, demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test

      - name: Dashboard build
        run: pnpm --filter dashboard build

      # The judge path from a clean checkout, on the simulated hub.
      - name: Demo (simulated hub)
        run: pnpm demo

  contract:
    name: Hub contract (fmt, clippy, unit and sandbox tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts-near
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins Rust 1.99.1 with rustfmt, clippy and wasm32; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Sandbox tests deploy the committed out/hub.wasm and out/mock_ft.wasm on near-sandbox.
      - name: Tests
        run: cargo test

  sandbox:
    name: Demo, swarm, relayer, chain client and the local stack on near-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: NearRpcChain against a deployed hub
        run: pnpm --filter @payminto/chain test:sandbox

      # The full story on a real NEAR runtime: every check reads the chain, and the hub is locked.
      - name: Demo (near-sandbox)
        run: pnpm demo --chain sandbox

      - name: Swarm (near-sandbox)
        run: pnpm swarm --chain sandbox

      - name: Gas relayer against a deployed hub
        run: pnpm --filter @payminto/relayer test:sandbox

      # The product a person uses: contracts, node, dashboard, relayer and local signer on near-sandbox, with the
      # browser's steps driven through the same HTTP calls and checked against the chain.
      - name: Local stack (pnpm local --check)
        run: pnpm local --check

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-compose.yml requires these at parse time; a build bakes none of them into an image.
      - name: Build images
        run: docker compose build
        env:
          HUB_ACCOUNT: hub.ci.testnet
          OPERATOR_ACCOUNT: node.ci.testnet
          OPERATOR_KEY: unused-at-build-time
          NODE_SIGNING_SEED: unused-at-build-time
