<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Payminto thumbnail</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #0c121b; }
      #root { position: relative; width: 1280px; height: 720px; font-family: "Inter", sans-serif; color: #ffffff; overflow: hidden; background: radial-gradient(circle at 78% 45%, rgba(142,162,245,0.30) 0%, rgba(142,162,245,0) 55%), #0c121b; }
      #brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
      #brand img { width: 56px; height: 56px; }
      #headline { position: absolute; left: 60px; top: 138px; font-size: 124px; line-height: 1.04; font-weight: 900; letter-spacing: -0.045em; text-transform: uppercase; }
      #headline .pay { display: inline-block; color: #0c121b; background: #8ea2f5; padding: 0 20px; line-height: 0.98; border-radius: 18px; }
      #sub { position: absolute; left: 64px; top: 560px; font-size: 40px; font-weight: 800; color: #f2b45a; letter-spacing: -0.01em; }
      #chip { position: absolute; left: 64px; top: 628px; font-size: 22px; font-weight: 700; color: #95a0b2; letter-spacing: 0.08em; text-transform: uppercase; }
      .agent { position: absolute; width: 190px; height: 190px; border-radius: 48px; background: #2443b8; box-shadow: 0 20px 60px rgba(36,67,184,0.55); }
      .agent .eye { position: absolute; top: 70px; width: 34px; height: 34px; border-radius: 50%; background: #ffffff; }
      .agent .mouth { position: absolute; left: 55px; top: 128px; width: 80px; height: 14px; border-radius: 7px; background: #c9d3fb; }
      .agent .ant { position: absolute; left: 87px; top: -34px; width: 16px; height: 40px; border-radius: 8px; background: #8ea2f5; }
      .agent .ant::after { content: ""; position: absolute; left: -8px; top: -18px; width: 32px; height: 32px; border-radius: 50%; background: #f2b45a; }
      #a1 { left: 800px; top: 110px; }
      #a2 { left: 1040px; top: 480px; background: #008a7b; box-shadow: 0 20px 60px rgba(0,138,123,0.55); }
      #arrow { position: absolute; left: 900px; top: 320px; width: 220px; height: 140px; }
      #coin { position: absolute; left: 1010px; top: 300px; width: 96px; height: 96px; border-radius: 50%; background: #f2b45a; color: #0c121b; font-size: 26px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 6px solid #ffd58f; }
      #lock { position: absolute; left: 720px; top: 640px; padding: 12px 20px; border-radius: 14px; background: rgba(18,26,38,0.92); border: 2px solid #2a3648; font-size: 24px; font-weight: 800; color: #e6eaf0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720" data-no-timeline>
      <div id="brand"><img src="assets/payminto-mark.svg" alt="" />Payminto</div>
      <div id="headline">Agents<br /><span class="pay">pay</span><br />agents</div>
      <div id="sub">Self-hosted. No middleman.</div>
      <div id="chip">Live on testnet</div>
      <div class="agent" id="a1"><div class="ant"></div><div class="eye" style="left:48px"></div><div class="eye" style="left:108px"></div><div class="mouth"></div></div>
      <svg id="arrow" viewBox="0 0 220 140"><path d="M10 10 C 100 10, 170 50, 190 120" fill="none" stroke="#e6eaf0" stroke-width="10" stroke-linecap="round" /><path d="M170 112 L192 128 L202 102" fill="none" stroke="#e6eaf0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /></svg>
      <div id="coin">USDC</div>
      <div class="agent" id="a2"><div class="ant"></div><div class="eye" style="left:48px"></div><div class="eye" style="left:108px"></div><div class="mouth"></div></div>
      <div id="lock">Inside a hard budget</div>
    </div>
  </body>
</html>
