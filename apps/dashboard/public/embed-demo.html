<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northwind Coffee - embed demo</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #0e1726;
        --muted: #5b6474;
        --line: #e3e6eb;
        --accent: #9a3412;
        --ok-bg: #e7f6ee;
        --ok: #12704a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b111a;
          --card: #121a26;
          --text: #e8ecf2;
          --muted: #9aa4b5;
          --line: #243041;
          --accent: #f59e66;
          --ok-bg: #0f2a1f;
          --ok: #5fd39e;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 34rem; margin: 0 auto; padding: 48px 16px; }
      .note { font-size: 13px; color: var(--muted); margin: 0 0 24px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
      h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
      .price { font-size: 14px; color: var(--muted); margin: 16px 0 20px; }
      button { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
      @media (prefers-color-scheme: dark) { button { color: #1a0d05; } }
      button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
      #status { margin-top: 16px; min-height: 24px; font-size: 14px; color: var(--muted); }
      #status.paid { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 10px 12px; }
      pre { margin: 24px 0 0; padding: 12px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <main>
      <p class="note">A pretend shop page on another site, to show the Payminto drop-in. Add <code>?link=&lt;slug&gt;</code> to try one of your own payment links.</p>
      <div class="card">
        <h1>Northwind Coffee</h1>
        <p class="note" style="margin: 0">Single origin beans, 250 g</p>
        <p class="price">The price is set by the payment link.</p>
        <button type="button" id="pay" data-payminto-link="pro-plan">Pay with crypto</button>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
      <pre id="code"></pre>
    </main>
    <script>
      (function () {
        var slug = new URLSearchParams(location.search).get("link");
        var button = document.getElementById("pay");
        if (slug && /^[A-Za-z0-9_-]{1,80}$/.test(slug)) button.setAttribute("data-payminto-link", slug);
        document.getElementById("code").textContent =
          '<script src="' + location.origin + '/embed.js" defer><\/script>\n<button data-payminto-link="' + button.getAttribute("data-payminto-link") + '">Pay with crypto</button>';
        var status = document.getElementById("status");
        button.addEventListener("payminto:payment", function (e) {
          status.className = "";
          status.textContent = "Payment " + e.detail.id + " is " + e.detail.status.replace("_", " ") + ".";
        });
        button.addEventListener("payminto:paid", function (e) {
          status.className = "paid";
          status.textContent = "Paid. Thank you. Payment " + e.detail.id + ".";
        });
      })();
    </script>
    <script src="/embed.js" defer></script>
  </body>
</html>
